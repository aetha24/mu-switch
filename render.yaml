services:
  - type: web
    name: moneyunify-switch
    runtime: docker
    healthCheckPath: /up
    dockerCommand: ./docker/start-web.sh
    envVars:
      - key: APP_NAME
        value: MoneyUnify Switch
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: moneyunify-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: MAIL_MAILER
        value: log
  - type: worker
    name: moneyunify-worker
    runtime: docker
    dockerCommand: ./docker/start-worker.sh
    envVars:
      - key: APP_NAME
        value: MoneyUnify Switch
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        fromService:
          type: web
          name: moneyunify-switch
          envVarKey: APP_KEY
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: moneyunify-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: MAIL_MAILER
        value: log
databases:
  - name: moneyunify-db
    databaseName: moneyunify
    user: moneyunify
